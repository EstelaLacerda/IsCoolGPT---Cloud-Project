name: IsCoolGPT CI Pipeline 

on:
  push:
    branches: [ "main", "development" ] 
  pull_request:
    branches: [ "main", "staging" ] 

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar Lint (Flake8)
      run: |
        # Para o build se houver erros de sintaxe Python ou nomes indefinidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Roda verificação de estilo (aviso, mas não quebra se estiver levemente fora)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Rodar Testes Unitários
      run: |
        pytest
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  docker-build:
    needs: quality-check 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Construir Imagem Docker
      run: docker build . --file Dockerfile --tag iscoolgpt:latest